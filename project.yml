name: TanaCount
options:
  bundleIdPrefix: com.sidebiz
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TanaCount:
    type: application
    platform: iOS
    sources: [TanaCount]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidebiz.tanacount
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 棚卸カウンター
        INFOPLIST_KEY_NSCameraUsageDescription: バーコードを読み取って在庫を数えるためにカメラを使います。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      storeKitConfiguration: TanaCount.storekit
      testTargets: [TanaCountTests]
  TanaCountTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TanaCountTests]
    dependencies:
      - target: TanaCount
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
